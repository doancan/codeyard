[package]
name = "cyx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line tool for Codeyard extension authors: scaffold, run with hot reload, check, package, import from VS Code"
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "rustls-native-certs", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
ext-core = { version = "0.5.0", path = "../ext-core" }
ext-manifest = { version = "0.5.0", path = "../ext-manifest" }
ext-pkg = { version = "0.5.0", path = "../ext-pkg" }
serde_json = "1.0.154"

[dev-dependencies]
ext-core = { version = "0.5.0", path = "../ext-core", features = ["testing"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
yard = { version = "0.5.0", path = "../yard" }
