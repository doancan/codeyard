[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Codeyard editor application: GPUI views, commands and the workbench"
repository.workspace = true
publish = false

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
accesskit = "0.25.1"
alacritty_terminal = "0.26.0"
buffer = { version = "0.2.2", path = "../buffer" }
dirs = "7.0.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
gpui = "=0.2.2"
host = { version = "0.2.2", path = "../host" }
# Find/replace: the same matcher as search in files (Turkish i/İ/ı, word, regex).
agent = { version = "0.2.2", path = "../agent" }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Conflict marker pre-scan (SIMD); already in the dependency tree.
memchr = "2.8.3"
mimalloc = "0.1.52"
nucleo-matcher = "0.3.1"
proto = { version = "0.2.2", path = "../proto" }
schema = { version = "0.2.2", path = "../schema" }
sha2 = "0.11.1"
# Ed25519 verification of the update manifest; already in the tree through rustls, so no new code ships.
ring = { version = "0.17.14", default-features = false }
serde_json = "1.0.154"
spell = { version = "0.2.2", path = "../spell" }
state = { version = "0.2.2", path = "../state" }
syntax = { version = "0.2.2", path = "../syntax" }
theme = { version = "0.2.2", path = "../theme" }
similar = { version = "3", default-features = false, features = ["text"] }
pulldown-cmark = { version = "0.13.5", default-features = false }

[[bin]]
name = "codeyard"
path = "src/main.rs"

[dev-dependencies]
accesskit_consumer = "0.39.1"
agent = { version = "0.2.2", path = "../agent" }
gpui = { version = "=0.2.2", features = ["test-support"] }
# Tests generate a throw-away signing key.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }

# Update install: atomic app swap and process liveness checks (libc is already used by host, agent and syntax).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# macOS: Dock icon (also when run unbundled: cargo run, bare binary).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }

# macOS accessibility (VoiceOver): AccessKit adapter that dynamically subclasses NSView.
accesskit_macos = "0.27.1"
raw-window-handle = "0.6"
