[package]
name = "ext-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extension views: the declarative element tree, validation, keyed diff, host-side input state and accessibility roles"
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
ext-manifest = { version = "0.6.0", path = "../ext-manifest" }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
