[package]
name = "ext-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frames between the Codeyard app and an extension host process"
repository.workspace = true
publish = false

[dependencies]
ext-api = { version = "0.5.0", path = "../ext-api" }
ext-manifest = { version = "0.5.0", path = "../ext-manifest" }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
