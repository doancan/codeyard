[package]
name = "ext-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "codeyard-exthost: runs one extension's WebAssembly component, the only binary that links wasmtime"
repository.workspace = true
publish = false

[[bin]]
name = "codeyard-exthost"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
ext-api = { version = "0.6.0", path = "../ext-api" }
ext-manifest = { version = "0.6.0", path = "../ext-manifest" }
ext-proto = { version = "0.6.0", path = "../ext-proto" }
sha2 = "0.11.1"
# The `AsyncWrite` trait for the guest's stdout and stderr (wasmtime-wasi already links tokio).
tokio = { version = "1.54.1", default-features = false }
wasmtime = { version = "50.0.0", default-features = false, features = ["cranelift", "component-model", "runtime", "parallel-compilation", "incremental-cache", "addr2line", "demangle", "std"] }
wasmtime-wasi = { version = "50.0.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
