[package]
name = "ext-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "codeyard-exthost: runs one extension's WebAssembly component, the only binary that links wasmtime"
repository.workspace = true
publish = false

[[bin]]
name = "codeyard-exthost"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
ext-api = { version = "0.7.0", path = "../ext-api" }
ext-manifest = { version = "0.7.0", path = "../ext-manifest" }
ext-proto = { version = "0.7.0", path = "../ext-proto" }
# Trap frames name Rust functions as authors wrote them (wasmtime already links it).
rustc-demangle = "0.1.28"
sha2 = "0.11.1"
# The `AsyncWrite` trait for the guest's stdout and stderr (wasmtime-wasi already links tokio).
tokio = { version = "1.54.1", default-features = false }
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "component-model", "runtime", "parallel-compilation", "incremental-cache", "addr2line", "demangle", "std"] }
wasmtime-wasi = { version = "50.0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
