[package]
name = "ext-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extension manifest (codeyard-extension.toml): parsing, validation, activation, permissions and risk"
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }

# The shared rule cases for the TypeScript mock host (rule_cases_tests.rs).
[dev-dependencies]
serde_json = "1.0.154"
