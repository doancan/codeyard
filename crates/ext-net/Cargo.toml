[package]
name = "ext-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network for extensions: HTTPS to the hosts in `net` only, with the peer address of every connection checked"
repository.workspace = true
publish = false

[dependencies]
ext-manifest = { version = "0.6.0", path = "../ext-manifest" }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "rustls-native-certs", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time"] }
