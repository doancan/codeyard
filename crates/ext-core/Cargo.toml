[package]
name = "ext-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Installed extensions: content-addressed store, lock file, install transactions, contribution index, trust, registry index verification"
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
ext-manifest = { version = "0.5.0", path = "../ext-manifest" }
ext-pkg = { version = "0.5.0", path = "../ext-pkg" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
rustls-pki-types = "1.15.1"
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
