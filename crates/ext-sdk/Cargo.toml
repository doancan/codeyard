[package]
name = "codeyard-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Write Codeyard extensions in Rust: commands, views and providers, built for wasm32-wasip2 with plain cargo"
repository.workspace = true
# Pre-release: extensions depend on it by git or path until the API reaches 1.0 (docs/extensions/commands.md).
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Tests check what `ui` builds with Codeyard's own view rules.
[dev-dependencies]
ext-ui = { version = "0.7.0", path = "../ext-ui" }

# Only inside a component; on the host target the SDK talks to the mock host of codeyard-extension-test.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc", "std"] }
