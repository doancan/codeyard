[package]
name = "spike-guest-big"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# Real-world weight: a parser stack an integration extension would plausibly carry, to reach a ~2 MB component.
[dependencies]
wit-bindgen = "0.63"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
