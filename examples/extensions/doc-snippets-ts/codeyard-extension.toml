# The extension the TypeScript snippets of docs/extensions run in: the tests in test/ check their calls against it.
[extension]
id          = "codeyard.doc-snippets-ts"
version     = "0.1.0"
name        = "Doc Snippets Ts"
license     = "MIT"
description = "The TypeScript snippets of the extension docs."

[code]
entry = "src/extension.ts"

[[commands]]
id    = "hello"
title = "Doc Snippets Ts: Say Hello"
