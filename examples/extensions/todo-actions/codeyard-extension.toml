[extension]
id          = "codeyard.todo-actions"
version     = "0.1.0"
name        = "TODO Actions"
license     = "MIT"
description = "Mark TODO comments done, or collect them; hover and completion for TODO markers, a lens and a count on each TODO."

[code]
entry = "Cargo.toml"

# Codeyard asks for actions (the light bulb, Cmd+.) in files of these languages.
[[code-actions]]
languages = ["rust", "markdown"]

# Hover text for TODO markers, shown next to the language server's.
[[hover]]
languages = ["rust", "markdown"]

# Completions for markers in comments; typing a word asks, and so does `/` (the end of `//`).
[[completion]]
languages = ["rust", "markdown"]
trigger-characters = ["/"]

# A "Collect" lens above each TODO in view, and a hint after it with its place among the file's TODOs.
[[code-lens]]
languages = ["rust", "markdown"]

[[inlay-hints]]
languages = ["rust", "markdown"]

[[commands]]
id    = "list"
title = "TODO Actions: Show Collected TODOs"

# What the lens runs, with the TODO as its argument.
[[commands]]
id    = "collect"
title = "TODO Actions: Collect TODO"
