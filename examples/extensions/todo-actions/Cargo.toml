[package]
name = "todo-actions"
version = "0.1.0"
edition = "2024"
publish = false

# A WebAssembly component: `cyx package` builds it with `cargo build --release --target wasm32-wasip2`.
[lib]
crate-type = ["cdylib"]

[dependencies]
codeyard-extension = { path = "../../../crates/ext-sdk" }

[dev-dependencies]
codeyard-extension-test = { path = "../../../crates/ext-test" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"

[workspace]
