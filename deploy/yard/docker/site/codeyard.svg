<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Codeyard — macOS app icon</title>
  <desc>A mint green angular C enclosing a branching Y on a graphite rounded tile. Original vector artwork.</desc>
  <defs>
    <linearGradient id="tile" x1="180" y1="80" x2="820" y2="944" gradientUnits="userSpaceOnUse"><stop stop-color="#303B3B"/><stop offset=".5" stop-color="#182525"/><stop offset="1" stop-color="#0C1718"/></linearGradient>
    <linearGradient id="edge" x1="512" y1="72" x2="512" y2="952" gradientUnits="userSpaceOnUse"><stop stop-color="#718583" stop-opacity=".65"/><stop offset=".5" stop-color="#344846" stop-opacity=".2"/><stop offset="1" stop-color="#56736D" stop-opacity=".35"/></linearGradient>
    <linearGradient id="mint" x1="280" y1="264" x2="704" y2="744" gradientUnits="userSpaceOnUse"><stop stop-color="#B6FFD7"/><stop offset=".5" stop-color="#67EAB1"/><stop offset="1" stop-color="#28BD91"/></linearGradient>
  </defs>
  <rect x="72" y="82" width="880" height="880" rx="198" fill="#000" opacity=".12"/>
  <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#tile)"/>
  <rect x="74" y="74" width="876" height="876" rx="196" stroke="url(#edge)" stroke-width="4"/>
  <!-- C: an open, hexagonal code enclosure -->
  <path d="M514 244 282 378Q268 386 268 402V622Q268 638 282 646L514 780 594 734 366 602V422L514 336 612 393 692 347 514 244Z" fill="url(#mint)"/>
  <!-- Y: two branches converging into one stem -->
  <path d="M470 428 550 382 630 428 710 382 790 428 676 494V644L584 697V494L470 428Z" fill="url(#mint)"/>
  <path d="M630 520 676 494V644L630 671V520Z" fill="#137E69" opacity=".36"/>
</svg>
