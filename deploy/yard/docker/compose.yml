# The registry and the Codeyard site as a Docker Compose stack behind the server's reverse proxy (Nginx Proxy Manager,
# which holds the domains and their certificates). docs/registry.md, "Running on Docker". Nothing publishes a host port:
# compose.npm.yml puts `yard` on the proxy's network (or compose.port.yml publishes one port, for a proxy that is not
# in Docker).
#
#   yard         yard serve: the registry's API and files, and the site (site/) on every other path
#   litestream   copies yard.sqlite to R2 as it changes
#   ops          the scheduler: re-sign, watch, backup, weekly restore check; and the shell for `yard …` commands
#
# The image is ghcr.io/<owner>/codeyard-yard (YARD_IMAGE in .env, built by the yard-image workflow with yard inside),
# or built here from this folder with yard mounted from ./bin. Secrets are only in .env, and each service gets only the
# part it uses.
name: yard

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: { max-size: 10m, max-file: "5" }

x-image: &image "${YARD_IMAGE:-codeyard/yard-ops:local}"

x-registry-folder: &registry-folder "${YARD_DATA:-yard-data}:/srv/yard"
x-binary-folder: &binary-folder "${YARD_BIN:-./bin}:/opt/yard/bin:ro"

services:
  yard:
    <<: *service
    image: *image
    build:
      context: .
    user: "10001:10001"
    command: ["yard", "serve", "/srv/yard/yard.json"]
    volumes: [*registry-folder, *binary-folder]
    tmpfs: [/tmp]
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s

  litestream:
    <<: *service
    image: *image
    pull_policy: never
    user: "10001:10001"
    command: ["litestream", "replicate", "-config", "/etc/litestream.yml"]
    volumes: [*registry-folder]
    tmpfs: [/tmp]
    environment:
      YARD_R2_BUCKET:
      YARD_R2_ENDPOINT:
      YARD_R2_ACCESS_KEY_ID:
      YARD_R2_SECRET_ACCESS_KEY:
    depends_on:
      yard: { condition: service_healthy }
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ops:
    <<: *service
    image: *image
    pull_policy: never
    user: "10001:10001"
    command: ["yard-scheduler"]
    volumes: [*registry-folder, *binary-folder, "ops-work:/work"]
    tmpfs: [/tmp]
    environment:
      YARD_DOMAIN:
      YARD_R2_BUCKET:
      YARD_R2_ENDPOINT:
      YARD_R2_ACCESS_KEY_ID:
      YARD_R2_SECRET_ACCESS_KEY:
      YARD_ALERT_WEBHOOK:
      YARD_ALERT_SMTP_URL:
      YARD_ALERT_SMTP_USER:
      YARD_ALERT_SMTP_PASSWORD:
      YARD_ALERT_FROM:
      YARD_ALERT_TO:
    depends_on:
      yard: { condition: service_healthy }
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "yard-health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  # The registry's folder when YARD_DATA is not a path on the host (a developer machine, the test).
  yard-data:
  ops-work:
