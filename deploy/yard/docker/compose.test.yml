# Added to compose.yml by test.sh: a stand-in R2 (MinIO), a stand-in alert channel (it keeps what is posted), and the one
# host port the test needs to reach `edge` from the developer's machine. Never used on the server.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: yardtest
      MINIO_ROOT_PASSWORD: yardtest-secret
    tmpfs: [/data]

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - sh
      - -c
      - until mc alias set m http://minio:9000 yardtest yardtest-secret; do sleep 1; done; mc mb --ignore-existing m/yard-test
    depends_on: [minio]
    restart: "no"

  hook:
    image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
    command:
      - python
      - -c
      - |
        import http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers.get("content-length", 0)))
                open("/hook/posts.log", "ab").write(body + b"\n")
                self.send_response(200)
                self.end_headers()
            def log_message(self, *a):
                pass
        http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
    volumes: ["hook:/hook"]

  edge:
    ports: ["127.0.0.1:${YARD_TEST_PORT:-18788}:8000"]

  ops:
    depends_on:
      createbucket: { condition: service_completed_successfully }

  litestream:
    depends_on:
      createbucket: { condition: service_completed_successfully }

volumes:
  hook:
