name: ci
# What a pull request has to wait for is short: formatting, clippy, a Windows build check and the dependency and licence
# gates (about four minutes). The tests (the app's in parallel shards, the crates without GPUI on Linux) run on every pull
# request too but are advisory there: a red one shows in the pull request, it does not hold it up. They are the gate where it
# matters: a push to develop runs the whole workspace on macOS, the memory budgets and the Linux tests, and a pull request
# from develop into main (`release-ready`) passes only when that run succeeded for the same commit. The nightly run and
# a manual run add the slowest checks: every test natively on Windows, the standalone Windows build and the full Linux app run.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      coverage:
        description: Also run the optional instrumented coverage job
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes the previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check branch protection asks for: what a pull request waits for besides Windows and the dependency gates. The tests are
  # advisory there (see the top of this file); `release-ready` is what holds main back. clippy runs on Linux for a pull request
  # (plentiful runners; the macOS ones queue) and on macOS as well on every push, which lints the code only macOS builds.
  lint:
    needs: [clippy-linux, fast-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require clippy, formatting, and the architecture and documentation checks
        env:
          CLIPPY: ${{ needs.clippy-linux.result }}
          FAST: ${{ needs.fast-checks.result }}
        run: |
          echo "clippy: $CLIPPY; formatting, architecture and documentation: $FAST"
          test "$CLIPPY" = success
          test "$FAST" = success

  # clippy for the workspace on Linux: libraries and binaries on a pull request, test code too on a push.
  clippy-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-linux-clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      # Our crates only: the patched copies under vendor/ are not linted.
      - run: cargo clippy --locked --workspace -- -D warnings
        if: github.event_name == 'pull_request'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: github.event_name != 'pull_request'

  # Formatting, the architecture and documentation checks: no compiler and no GPUI needed, so a Linux runner has them done
  # in under a minute while clippy is still building.
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: scripts/arch-check.sh   # also checks the vendor patches (scripts/check-gpui-patches.sh)
      - run: scripts/docs-check.sh
      - run: cargo fmt --all --check

  # clippy on macOS, on every push (not on a pull request: see `lint`): it lints what only macOS builds, test code included.
  macos-lint:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-macos-lint
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Metal toolchain (GPUI shaders)
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || echo "::warning::xcodebuild -downloadComponent MetalToolchain failed"
          fi
          xcrun -sdk macosx metal --version || { echo "::error::The Metal compiler is not available: GPUI cannot compile its shaders"; exit 1; }
      # Our crates only: the patched copies under vendor/ are not linted.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The app crate holds nearly all of the tests. A pull request runs them in three parallel shards (scripts/ci-shard.sh) on Linux:
  # the runners there are plentiful and have four cores (a macOS runner has three, and a pull request that needs four of them
  # queues behind every other run); macos-tests runs the same tests on macOS on every push. The test binary is built
  # incrementally from the state the last push to develop saved (`linux-incremental`), so a pull request compiles what it changed.
  linux-shard:
    if: github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'develop')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-linux-app
          save-if: "false"
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git openssh-server \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: incr-app-tests-linux-${{ github.sha }}
          restore-keys: incr-app-tests-linux-
      # The exthost and the agent are built first: the extension tests of the app run the real exthost inside the OS
      # sandbox, and the SSH tests start the agent through the throw-away sshd (`cargo test -p app` does not build them).
      - run: cargo build --locked -p ext-host -p agent
      - run: scripts/ci-shard.sh ${{ matrix.shard }} 3
        env:
          CARGO_INCREMENTAL: "1"
          CODEYARD_REQUIRE_SSHD: "1"
          CODEYARD_TEST_TIMEOUT_SCALE: "3"
          CODEYARD_REQUIRE_TOOLS: codeyard-exthost

  # Keeps the incremental build state of the app's test binary for the shards of the next pull requests: the same build a shard
  # does, saved under the commit. Pushes to develop and main only.
  linux-incremental:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-linux-app
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git openssh-server \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: incr-app-tests-linux-${{ github.sha }}
          restore-keys: incr-app-tests-linux-
      - run: cargo test --locked -p app --bin codeyard --no-run
        env:
          CARGO_INCREMENTAL: "1"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: incr-app-tests-linux-${{ github.sha }}

  # Every test of the workspace: pushes to develop and main, the nightly run and manual runs.
  macos-tests:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-macos-tests
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Metal toolchain (GPUI shaders)
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || echo "::warning::xcodebuild -downloadComponent MetalToolchain failed"
          fi
          xcrun -sdk macosx metal --version || { echo "::error::The Metal compiler is not available: GPUI cannot compile its shaders"; exit 1; }
      # macOS runners ship sshd: a skipped SSH test is a failure here, not a silent pass.
      # The scale only loosens the wall-clock budgets of the tests (debug builds on shared runners are several times
      # slower than a laptop); a quadratic blow-up still fails them.
      - run: cargo test --locked --workspace
        env:
          CODEYARD_REQUIRE_SSHD: "1"
          CODEYARD_TEST_TIMEOUT_SCALE: "3"
          # Code extensions run in codeyard-exthost inside the OS sandbox, which this runner has: their tests must run.
          CODEYARD_REQUIRE_TOOLS: codeyard-exthost

  # Memory and size budgets (a release build): not part of the pull request gate.
  macos-budgets:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Match bundle-macos.sh so its cached production dependencies can be reused.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: app-macos
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Metal toolchain (GPUI shaders)
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || echo "::warning::xcodebuild -downloadComponent MetalToolchain failed"
          fi
          xcrun -sdk macosx metal --version || { echo "::error::The Metal compiler is not available: GPUI cannot compile its shaders"; exit 1; }
      # What this step guards: the app binary size, the agent sizes and the idle agent daemon's memory do not depend
      # on the display, so they are enforced exactly. The window rows (terminal, welcome, files) are budgeted for
      # Retina and the runner has a 1x display, so they only catch gross regressions (they measure lower here).
      # The real measurement of those is the maintainer's machine (`scripts/check.sh --budgets`). A process that
      # cannot start or be measured fails the step; it never passes as "ok".
      - run: scripts/memcheck.sh

  # Dependency gate: licences, known vulnerabilities, yanked versions, sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: EmbarkStudios/cargo-deny-action@v2

  # RustSec scan of Cargo.lock; accepted exceptions are in .cargo/audit.toml (scripts/audit.sh).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: scripts/audit.sh

  # Licence files that every release artifact ships (and that bundle-windows.ps1 / codeyard.iss list the same way),
  # and THIRD_PARTY_CRATES.md against Cargo.lock. `cargo fetch` first: the check reads every crate's manifest offline.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - run: scripts/licenses.sh
      # Release signing and verification logic (good release, tampered asset, tampered sums, wrong key, missing signature).
      - run: scripts/verify-release.sh --self-test
      - run: python3 scripts/test-macos-notarization.py
      - run: cargo fetch --locked
      - run: python3 -I scripts/test-crate-licenses.py
      - run: python3 -I scripts/crate-licenses.py --check
      # The TypeScript SDK's npm packages (build tools cyx installs, dev dependencies) against THIRD_PARTY_NPM.md.
      - run: python3 -I scripts/npm-licenses.py --check
      # Project board rules (scripts/project-sync.py, run by project.yml).
      - run: python3 -I scripts/test-project-sync.py
      # Performance gate decisions (scripts/perf/compare.py).
      - run: python3 -I scripts/test-perf-compare.py

  # Optional coverage, started by hand only (takes minutes). The result is uploaded as an artifact.
  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.coverage == true
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-coverage
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Metal toolchain (GPUI shaders)
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || echo "::warning::xcodebuild -downloadComponent MetalToolchain failed"
          fi
          xcrun -sdk macosx metal --version || { echo "::error::The Metal compiler is not available: GPUI cannot compile its shaders"; exit 1; }
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - run: scripts/coverage.sh
        env:
          CODEYARD_REQUIRE_SSHD: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # The crates that do not depend on GPUI, plus the musl agent and its size limit
  # (the agent runs on Linux servers), and the extension SDKs and examples (the only job with the wasm32-wasip2 target
  # and Node.js for TypeScript extensions).
  linux-tests:
    # Not for the pull request from develop into main: develop's own full run already tested the same commit.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, wasm32-wasip2
      # TypeScript extensions: cyx builds them with Node.js (sdk/typescript/toolchain), `npm test` runs .ts directly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: TypeScript SDK (type check and tests)
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test
      # Before cargo test: cyx's tests build the TypeScript examples, which need their node_modules.
      - name: TypeScript example extensions (type check and unit tests against the mock host)
        run: for d in examples/extensions/*/; do if [ -f "$d/package.json" ]; then (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test) || exit 1; fi; done
      # ext-host builds codeyard-exthost, which cyx's tests use to run examples/extensions (`cyx test`, Rust and
      # TypeScript); with CODEYARD_REQUIRE_WASM a missing target, exthost or Node.js fails those tests instead of skipping
      # them. The explicit build keeps the exthost binary in place whatever cargo test decides to build.
      - run: cargo build --locked -p ext-host && cargo test --locked -p proto -p agent -p host -p buffer -p state -p syntax -p theme -p ext-manifest -p ext-pkg -p ext-core -p ext-proto -p ext-host -p ext-net -p cyx -p yard -p codeyard-extension -p codeyard-extension-test
        env:
          CODEYARD_REQUIRE_WASM: "1"
      - name: Example extensions (unit tests against the mock host)
        run: for d in examples/extensions/*/; do if [ -f "$d/Cargo.toml" ]; then cargo test --locked --manifest-path "$d/Cargo.toml" --target-dir target/examples || exit 1; fi; done
      # "A command in under 5 minutes" (docs/plugin-architecture.md §9): cyx new, unit tests and cyx test from an empty
      # folder, Rust and TypeScript, each step timed; fails past 300 s.
      - run: scripts/check-five-minutes.sh
        if: github.event_name != 'pull_request'
      # The shipped Linux agents are built with cargo-zigbuild (release.yml, docs/releasing.md), so the size gate builds
      # the same way. A plain `cargo build` with the system linker produces a static-PIE (+170 KB of relocations) and
      # measures ~1.7 MB: not the artifact users get. pip installs cargo-zigbuild together with zig.
      # The agent size gate and the five-minute check are part of the full tier: they take minutes and a pull request rarely
      # touches what they measure.
      - run: pip3 install --user cargo-zigbuild
        if: github.event_name != 'pull_request'
      - run: cargo zigbuild --locked --profile release-agent -p agent --target x86_64-unknown-linux-musl
        if: github.event_name != 'pull_request'
      - name: Agent size budget
        if: github.event_name != 'pull_request'
        run: |
          SIZE=$(du -k target/x86_64-unknown-linux-musl/release-agent/codeyard-agent | cut -f1)
          echo "agent: ${SIZE} KB (budget 1664 KB)"
          test "$SIZE" -le 1664

  # Full workspace and GPUI on Linux. Promoted after four consecutive successful
  # workspace test runs; failures now fail CI instead of being converted to warnings.
  linux-app:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-linux-app
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git openssh-server \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      # The scale only loosens the wall-clock budgets of the tests (debug builds on shared runners are several times
      # slower than a laptop); a quadratic blow-up still fails them.
      - run: cargo test --locked --workspace
        env:
          CODEYARD_REQUIRE_SSHD: "1"
          CODEYARD_TEST_TIMEOUT_SCALE: "3"
          # Code extensions run in codeyard-exthost inside the OS sandbox, which this runner has: their tests must run.
          CODEYARD_REQUIRE_TOOLS: codeyard-exthost
      # #182 end to end: `cyx new view` (Rust and TypeScript) built by cyx, installed and drawn by the window with the
      # real exthost (ext_template_views_tests.rs). After the workspace tests, so only this test sees the wasm32-wasip2
      # target; with CODEYARD_REQUIRE_WASM a missing target, cyx, exthost or Node.js fails it instead of skipping it.
      - run: rustup target add wasm32-wasip2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: cargo build --locked -p cyx -p ext-host && cargo test --locked -p app --bin codeyard -- ext_template_views
        env:
          CODEYARD_REQUIRE_WASM: "1"
          CODEYARD_TEST_TIMEOUT_SCALE: "3"
      # The public registry end to end on this runner (#70, docs/registry.md "Rehearsal"): ceremony with throwaway keys,
      # publish, install with the app, revoke, expired index.
      - run: deploy/rehearse.sh

  # The check branch protection asks for: does everything still compile and pass clippy on Windows (about three minutes
  # with the warm cache). The native tests and the standalone build run in the nightly and manual runs.
  windows:
    needs: [windows-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Windows build check
        env:
          RESULT: ${{ needs.windows-check.result }}
        run: |
          echo "Windows build check: $RESULT"
          test "$RESULT" = success

  windows-check:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-windows
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo clippy --locked --workspace --lib --bins -- -D warnings

  windows-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # Every test of the workspace, one at a time, after a release build: about twice the old filtered run.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: ci-windows
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Windows native checks
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\samples.txt"
          $sampler = Start-Job -ArgumentList $log {
            param($log)
            while ($true) {
              $os = Get-CimInstance Win32_OperatingSystem
              $procs = Get-Process
              "$(Get-Date -Format HH:mm:ss) free=$([int]($os.FreePhysicalMemory/1024))MB commitfree=$([int]($os.FreeVirtualMemory/1024))MB procs=$($procs.Count) handles=$(($procs | Measure-Object HandleCount -Sum).Sum)" | Add-Content $log
              $procs | Group-Object ProcessName | Sort-Object Count -Descending | Select-Object -First 5 | ForEach-Object { "   x$($_.Count) $($_.Name)" } | Add-Content $log
              $procs | Sort-Object CPU -Descending | Select-Object -First 5 | ForEach-Object { "   cpu=$([int]$_.CPU) ws=$([int]($_.WorkingSet64/1MB))MB $($_.ProcessName) $($_.Id)" } | Add-Content $log
              # A console host that burns a core (#236): when it started, whose child it is and what started beside it.
              $procs | Where-Object { $_.ProcessName -eq 'conhost' -and $_.CPU -gt 30 } | ForEach-Object {
                $w = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.Id)"
                "   spinning conhost $($_.Id) cpu=$([int]$_.CPU) started=$($w.CreationDate.ToString('HH:mm:ss.fff')) parent=$($w.ParentProcessId)"
                Get-CimInstance Win32_Process | Where-Object { [math]::Abs(($_.CreationDate - $w.CreationDate).TotalSeconds) -lt 2 -and $_.ProcessId -ne $w.ProcessId } | ForEach-Object { "      beside: $($_.ProcessId) $($_.Name) $("$($_.CommandLine)".Substring(0, [math]::Min(110, "$($_.CommandLine)".Length)))" }
              } | Add-Content $log
              Start-Sleep 60
            }
          }
          try { ./scripts/check-windows.ps1 -SkipStandalone } finally { Stop-Job $sampler; Get-Content $log }
        # The wall-clock budgets of the tests get an allowance for a shared runner: 3 on macOS and Linux, 4 here (the Windows runner
        # measures a keystroke on a folded 50k-line file at 51 ms against a 50 ms budget).
        env:
          CODEYARD_TEST_TIMEOUT_SCALE: "4"

  windows-standalone:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: app-windows
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}
      - name: Build and validate the standalone release EXE
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Profile Release

  # Holds main back; for any other pull request it passes at once. A pull request from develop into main passes when develop's
  # own run of this workflow succeeded for the same commit (it tests the whole workspace and the memory budgets, so nothing is
  # tested twice); it waits for that run if it is still going. Any other pull request into main has to pass the shards and the
  # Linux tests of its own run. One job and no `needs`: a job waits for the jobs it needs even when it would be skipped.
  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the tests that gate main
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE" != main ]; then echo "not a pull request into main: nothing to hold back"; exit 0; fi
          for i in $(seq 1 80); do
            if [ "$HEAD" = develop ]; then
              state=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=develop&event=push&head_sha=$SHA" \
                --jq '[.workflow_runs[] | select(.head_sha == env.SHA)] | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')
              echo "full run of $SHA on develop: ${state:-none yet}"
            else
              jobs=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name | test("^(linux-shard|linux-tests)")) | .conclusion // "pending"] | join(",")')
              echo "tests of this run: ${jobs:-not started}"
              case ",$jobs," in
                *,failure,*|*,cancelled,*) state="completed failure" ;;
                *,pending,*|",,") state="in_progress" ;;
                *) state="completed success" ;;
              esac
            fi
            case "$state" in
              "completed success") exit 0 ;;
              "completed "*) echo "::error::The tests that gate main failed (see above): fix them first"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::The tests that gate main did not finish in 40 minutes"
          exit 1
