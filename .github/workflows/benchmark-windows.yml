name: benchmark-windows
on:
  workflow_dispatch:
    inputs:
      host:
        description: Hosts to benchmark
        type: choice
        options: [both, linux, prepare]
        default: both
  push:
    branches: [perf/linux-windows-build]
    paths: ["crates/**", "vendor/**", Cargo.toml, Cargo.lock]
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build identical agents for both hosts
        run: |
          mkdir agents
          lld="$(dirname "$(rustc --print target-libdir)")/bin/rust-lld"
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            var="CARGO_TARGET_$(echo "$t" | tr 'a-z-' 'A-Z_')_LINKER"
            env "$var=$lld" cargo build --locked --profile release-agent -p agent --target "$t"
            cp "target/$t/release-agent/codeyard-agent" "agents/codeyard-agent-$t"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: benchmark-agents
          path: agents/
  shaders:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile shaders with the vendored GPUI build helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shaders | Out-Null
          rustc --edition 2024 -O vendor/gpui/build.rs -o shaders/build-shaders.exe
          if ($LASTEXITCODE -ne 0) { throw 'shader helper compilation failed' }
          $env:CARGO_CFG_TARGET_OS = 'windows'
          $env:CARGO_MANIFEST_DIR = (Resolve-Path vendor/gpui).Path
          $env:OUT_DIR = (Resolve-Path shaders).Path
          ./shaders/build-shaders.exe
          if ($LASTEXITCODE -ne 0) { throw 'FXC shader compilation failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: benchmark-shaders
          path: shaders/shaders_bytes.rs
          if-no-files-found: error
  build:
    if: inputs.host != 'prepare'
    needs: [agents, shaders]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.host == 'linux' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: benchmark-agents
          path: agents
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: benchmark-shaders
          path: shaders
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node.js 24
        if: runner.os == 'Linux'
        id: xwin
        with:
          path: ~/.cache/cargo-xwin
          key: codeyard-xwin-0.23.1-x64-v1
      - name: Install LLVM 19 and cargo-xwin
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19 ninja-build
          pip install cargo-xwin==0.23.1
          tools="$RUNNER_TEMP/llvm-msvc"
          mkdir -p "$tools"
          ln -s "$(command -v clang-19)" "$tools/clang-cl"
          ln -s "$(command -v lld-19)" "$tools/lld-link"
          ln -s "$(command -v llvm-rc-19)" "$tools/llvm-rc"
          ln -s "$(command -v llvm-lib-19)" "$tools/llvm-lib"
          echo "$tools" >> "$GITHUB_PATH"
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
          "$tools/clang-cl" --version
      - name: Prefetch Windows SDK (outside build timer)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo xwin cache xwin
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node.js 24
        if: runner.os == 'Linux' && steps.xwin.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/cargo-xwin
          key: codeyard-xwin-0.23.1-x64-v1
      - name: Prefetch Rust dependencies (outside build timer)
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Measure cold and dependency-cached compilation
        shell: bash
        run: |
          export AGENTS_DIR="$GITHUB_WORKSPACE/agents"
          export GPUI_PRECOMPILED_SHADERS="$GITHUB_WORKSPACE/shaders/shaders_bytes.rs"
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/benchmark-windows.py --cross
          else
            python scripts/benchmark-windows.py
          fi
      - name: Native standalone checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-standalone-agents.ps1 -Executable target/x86_64-pc-windows-msvc/release/codeyard.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.json
            target/x86_64-pc-windows-msvc/release/codeyard.exe
          if-no-files-found: warn
  validate-cross:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: benchmark-ubuntu-latest
          path: cross
      - name: Validate Linux-built EXE on real Windows
        shell: pwsh
        run: ./scripts/test-standalone-agents.ps1 -Executable cross/target/x86_64-pc-windows-msvc/release/codeyard.exe
  check-preparation:
    if: inputs.host == 'prepare'
    needs: [agents, shaders]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: benchmark-agents
          path: agents
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: benchmark-shaders
          path: shaders
      - name: Verify agent and shader artifact roundtrip
        shell: python
        run: |
          from pathlib import Path
          agents = list(Path('agents').glob('codeyard-agent-*'))
          assert len(agents) == 2, agents
          for agent in agents:
              assert agent.read_bytes()[:6] == b'\x7fELF\x02\x01', agent
          shaders = Path('shaders/shaders_bytes.rs').read_text()
          assert shaders.count('const ') == 16
