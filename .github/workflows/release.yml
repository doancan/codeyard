name: release
# Push a tag like v0.1.0 to build and publish a GitHub release.
# The release notes are the matching section of CHANGELOG.md.
# Nothing is published until every platform has built: macos and windows only upload artifacts,
# the last job creates the release in one step, so a failed Windows build never leaves a half release.
# Run it by hand (Actions > release > Run workflow) for a dry run: everything is built, bundled and checked
# and the files stay as artifacts, but no release is created. It signs too, with a throw-away key: the real signing key is
# only ever given to a run for a tag, because files signed with it verify in every installed app, whichever branch built them.
# Every release carries SHA256SUMS.txt.sig (Ed25519 over SHA256SUMS.txt, secret UPDATE_SIGNING_KEY) and RELEASE_NOTES.md:
# see docs/releasing.md.
on:
  push:
    tags: ["v*"]
    # A push to main that changes the dependencies or this file runs the whole thing as a dry run (no tag, no release): it fills the
    # build caches that the next tag restores, so a release does not compile every dependency again.
    branches: [main]
    paths: [Cargo.lock, ".github/workflows/release.yml", "vendor/**"]
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize with Apple credentials (main/develop only; publishes nothing)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Cheap checks first: a bad tag or a stale doc fails in a minute, not after the macOS build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Check tag, Cargo version and changelog agree
        run: |
          CARGO=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="app"))')
          # A dry run has no tag: use the Cargo version, so only the changelog section is checked.
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$CARGO"; fi
          [ "$VERSION" = "$CARGO" ] || { echo "tag $VERSION != Cargo version $CARGO"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }
      - run: scripts/arch-check.sh
      - run: scripts/docs-check.sh
      - run: scripts/licenses.sh
      - run: scripts/verify-release.sh --self-test
      - run: python3 scripts/test-macos-notarization.py
      # An unsigned release would make every installed app refuse to update, so a missing or wrong key fails here,
      # minutes in, not after the builds. The check signs a dummy file and verifies it with scripts/update-public-key.pem.
      # Tags only: a dry run never sees the key.
      - name: Check the update signing key
        if: github.ref_type == 'tag'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set +x
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error title=UPDATE_SIGNING_KEY is empty::The repository secret UPDATE_SIGNING_KEY is missing or empty. A release without a signature cannot be installed as an update. See docs/releasing.md."
            exit 1
          fi
          probe="$(mktemp -d)"
          echo "probe" > "$probe/SHA256SUMS.txt"
          scripts/sign-release.sh "$probe" || { echo "::error title=UPDATE_SIGNING_KEY does not match scripts/update-public-key.pem::See docs/releasing.md (key rotation)."; exit 1; }
          rm -rf "$probe"

      - name: Check Apple signing configuration
        if: github.ref_type == 'tag' || inputs.notarize == true
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF_NAME" != main ] && [ "$GITHUB_REF_NAME" != develop ]; then
            echo "::error::Signed dry runs are restricted to main/develop."
            exit 1
          fi
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. See docs/releasing.md (Apple signing)."
              exit 1
            fi
          done

  # Build SSH agents separately so platform app builds start in parallel. Keep cargo-zigbuild
  # for Linux agents: its artifact size matches the release-agent budget checked in CI.
  agents-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: agents-linux
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Install the Linux agent toolchain
        run: pip3 install --user cargo-zigbuild
      - name: Build the Linux agents
        run: |
          mkdir agents
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --profile release-agent -p agent --target "$t"
            cp "target/$t/release-agent/codeyard-agent" "agents/codeyard-agent-$t"
          done
          file agents/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: agents-linux
          path: agents/
          if-no-files-found: error

  agent-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: agent-macos
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Build the macOS agent
        run: |
          mkdir agents
          cargo build --locked --profile release-agent -p agent
          cp target/release-agent/codeyard-agent agents/codeyard-agent-aarch64-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: agents-macos
          path: agents/
          if-no-files-found: error

  macos:
    needs: [verify, agents-linux, agent-macos]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NOTARIZE_RELEASE: ${{ github.ref_type == 'tag' || inputs.notarize == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24

      - name: Read the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app-macos
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # A failed download is only a warning (older Xcodes ship `metal`); a missing compiler fails the release here,
      # with a clear message, not minutes later inside gpui's build.rs.
      - name: Metal toolchain (GPUI shaders)
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::xcodebuild -downloadComponent MetalToolchain failed"
          xcrun -sdk macosx metal --version || { echo "::error::The Metal compiler is not available: GPUI cannot compile its shaders"; exit 1; }

      # SSH agents: copied to the server on first connect, so they ship inside the app.
      - name: Download the SSH agents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          pattern: agents-*
          merge-multiple: true
          path: agents

      - name: Import Apple identity into a temporary keychain
        if: env.NOTARIZE_RELEASE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/macos-signing-keychain.sh setup

      - name: Build app, bundle and DMG
        run: AGENTS_DIR="$PWD/agents" scripts/bundle-macos.sh

      - name: Collect release files
        run: |
          mkdir dist
          NAME="codeyard-$VERSION-macos-arm64"
          cp target/release/Codeyard.dmg "dist/Codeyard-$VERSION-macos-arm64.dmg"
          # Single runnable binary (agents are looked up in an agents/ folder next to it).
          mkdir "$NAME"
          cp target/release/codeyard "$NAME/"
          cp -R agents "$NAME/agents"
          scripts/licenses.sh copy "$NAME/licenses"
          if [ "$NOTARIZE_RELEASE" = true ]; then
            codesign --force --timestamp --options runtime --identifier com.codeyard.cli --sign "$SIGN_IDENTITY" "$NAME/codeyard"
            for agent in "$NAME"/agents/codeyard-agent-*-apple-darwin; do
              if [ -f "$agent" ]; then
                codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$agent"
                codesign --verify --strict "$agent"
              fi
            done
            codesign --verify --strict "$NAME/codeyard"
            scripts/notarize-macos.sh "dist/Codeyard-$VERSION-macos-arm64.dmg" "$NAME" target/release/Codeyard.app
          fi
          # Notarization/stapling must finish before packaging and checksum generation.
          tar -czf "dist/$NAME.tar.gz" "$NAME"
          # Name the files: a bare `*` would also list SHA256SUMS.txt itself, created empty by the redirect.
          (cd dist && shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md [$VERSION] section has no text: the release notes would be empty"; exit 1; }
          if [ "$NOTARIZE_RELEASE" = true ]; then
            cat >> notes.md <<'NOTES'

          ### Install
          Open the DMG and drag **Codeyard** to Applications. The macOS build is signed with Developer ID and notarized by Apple.
          The DMG includes its notarization ticket. Standalone binaries in the tar.gz use Apple's online ticket lookup.
          NOTES
          else
            cat >> notes.md <<'NOTES'

          ### Install (unsigned dry run)
          Open the DMG and drag **Codeyard** to Applications. This test build is not notarized:
          on first launch approve it in System Settings > Privacy & Security.
          NOTES
          fi
          cat >> notes.md <<'NOTES'

          Windows: extract the Windows ZIP or run the Windows setup EXE.
          Windows builds are unsigned and may show a SmartScreen warning.
          NOTES

      - name: Upload macOS release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

      - name: Remove temporary Apple credentials
        if: always() && env.NOTARIZE_RELEASE == 'true'
        run: scripts/macos-signing-keychain.sh cleanup

  windows:
    needs: [verify, agents-linux, agent-macos]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app-windows
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Download SSH agents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          pattern: agents-*
          merge-multiple: true
          path: agents
      - name: Build Windows ZIP and installer
        run: |
          $env:AGENTS_DIR = (Resolve-Path agents).Path
          ./scripts/bundle-windows.ps1
          if (-not (Get-ChildItem target/windows/*-setup.exe)) {
            throw 'Windows installer was not generated'
          }
      - name: Checksums for the Windows files
        run: |
          $files = @(Get-ChildItem target/windows/*.zip, target/windows/*-setup.exe)
          if ($files.Count -lt 2) { throw 'expected the ZIP and the setup EXE' }
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          # Set-Content writes CRLF; the signed list must be plain LF (the updater rejects anything else).
          [System.IO.File]::WriteAllText((Join-Path $PWD 'target/windows/SHA256SUMS-windows.txt'), (($checksums -join "`n") + "`n"))
      - name: Upload Windows release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: release-windows
          path: |
            target/windows/*.zip
            target/windows/*-setup.exe
            target/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

  # The only job that writes to the repository, and only once everything above succeeded.
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: release-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: release-notes
          path: notes
      # The release body and the signed RELEASE_NOTES.md are the same file: what the app shows is what the release shows.
      - name: Merge checksums and verify every file against them
        working-directory: dist
        run: |
          cp ../notes/notes.md RELEASE_NOTES.md
          sha256sum RELEASE_NOTES.md > SHA256SUMS-notes.txt
          # Defence in depth: whatever a runner wrote, the signed list is LF only.
          cat SHA256SUMS.txt SHA256SUMS-windows.txt SHA256SUMS-notes.txt | tr -d '\r' > SHA256SUMS.all
          mv SHA256SUMS.all SHA256SUMS.txt
          rm SHA256SUMS-windows.txt SHA256SUMS-notes.txt
          # A mismatch here means an artifact was corrupted between the build and this job.
          sha256sum -c SHA256SUMS.txt
          ! grep -q "$(printf '\r')" SHA256SUMS.txt || { echo "SHA256SUMS.txt contains CR characters"; exit 1; }
          [ "$(grep -c . SHA256SUMS.txt)" -ge 5 ] || { echo "expected at least the DMG, tar.gz, ZIP, setup EXE and RELEASE_NOTES.md"; exit 1; }
          ls -l
      # Signs SHA256SUMS.txt (the only thing the in-app updater trusts) and checks the signature before anything is published.
      # A tag gets the real key, which is only in this step's environment. A dry run signs with a key made on the spot and checks
      # against its public half, so the signing path is exercised without handing out files that installed apps would accept.
      - name: Sign SHA256SUMS.txt
        if: github.ref_type == 'tag'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set +x
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error title=UPDATE_SIGNING_KEY is empty::Refusing to build an unsigned release."; exit 1; }
          scripts/sign-release.sh dist
      - name: Sign SHA256SUMS.txt with a throw-away key (dry run)
        if: github.ref_type != 'tag'
        run: |
          key="$(mktemp -d)"
          openssl genpkey -algorithm ed25519 -out "$key/k.pem"
          openssl pkey -in "$key/k.pem" -pubout -out "$key/k.pub"
          scripts/sign-release.sh dist --key-file "$key/k.pem" --pubkey "$key/k.pub"
          echo "THROWAWAY_PUBKEY=$key/k.pub" >> "$GITHUB_ENV"
      - name: Verify the signature and every file as a user would
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then scripts/verify-release.sh --dir dist; else scripts/verify-release.sh --dir dist --key "$THROWAWAY_PUBKEY"; fi
          [ "$(wc -c < dist/SHA256SUMS.txt.sig | tr -d ' ')" = 64 ]
          ls -l dist
      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --verify-tag
      - name: Dry run, show what would be published
        if: github.ref_type != 'tag'
        run: |
          echo "Dry run: no release created. Files that would be attached (signed and verified above):"
          ls -l dist
          echo "--- release notes ---"
          cat dist/RELEASE_NOTES.md
      # The files of a dry run (signed with the throw-away key: they only prove the pipeline, no installed app accepts them).
      - name: Keep the dry-run files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7
          if-no-files-found: error
