name: exthost-spike
# Phase 2 spike (#97): the exthost measurements on CI runners, for Linux and Windows numbers (informational; the
# reference numbers come from the reference Mac). Runs when the spike changes, or by hand.
on:
  pull_request:
    paths:
      - scripts/perf/exthost-spike/**
      - .github/workflows/exthost-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exthost-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - name: Measure
        run: |
          node --version
          scripts/perf/exthost-spike/run.sh "$RUNNER_TEMP/spike" | tee "$RUNNER_TEMP/report.md"
          { echo "### ${{ matrix.os }}"; echo; cat "$RUNNER_TEMP/report.md"; } >> "$GITHUB_STEP_SUMMARY"
