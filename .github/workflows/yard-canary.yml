# The registry's canary (docs/registry.md, "The canary"): publish a new version of codeyard.canary, revoke it on the
# server, and measure how long until the revocation is in the signed index clients fetch. The minutes go to the run's
# summary and to canary.tsv on the yard-canary-log branch (one line per run, for the release notes); a run fails if it
# takes longer than 2 hours. Does nothing until the YARD_URL variable is set.
name: yard-canary
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yard-canary

jobs:
  canary:
    if: vars.YARD_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: yard
    permissions:
      contents: write # canary.tsv on the yard-canary-log branch
      id-token: write # the keyless publisher signature (Sigstore) for codeyard.canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: yard-tools
      - run: cargo build --release --locked -p cyx
      - name: Publish a new canary version
        id: publish
        env:
          YARD_URL: ${{ vars.YARD_URL }}
          RUN: ${{ github.run_number }}
        run: |
          version="0.0.$RUN"
          sed -i "s/^version *= *\".*\"/version     = \"$version\"/" deploy/canary/codeyard-extension.toml
          target/release/cyx publish deploy/canary --registry "$YARD_URL"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          date +%s > published-at
      - name: Revoke it on the server
        env:
          SSH_KEY: ${{ secrets.YARD_CANARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.YARD_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.YARD_SSH_HOST }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/canary && chmod 600 ~/.ssh/canary
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/canary -o IdentitiesOnly=yes "canary@$HOST" "revoke $VERSION"
          date +%s > revoked-at
      - name: Wait until clients can see it
        env:
          YARD_URL: ${{ vars.YARD_URL }}
          YARD_ROOT_KEYS: ${{ vars.YARD_ROOT_KEYS }}
          YARD_THRESHOLD: ${{ vars.YARD_THRESHOLD }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set --
          for k in $(echo "$YARD_ROOT_KEYS" | tr ',' ' '); do set -- "$@" --root-key "$k"; done
          start=$(cat revoked-at)
          while :; do
            if target/release/cyx yard check "$YARD_URL" "$@" --threshold "${YARD_THRESHOLD:-2}" --revoked "codeyard.canary@$VERSION"; then
              seen=$(date +%s)
              minutes=$(( (seen - start + 59) / 60 ))
              echo "Canary codeyard.canary $VERSION: the revocation was in the signed index after $minutes min. Clients fetch the index at most once a day, so an online client stops it within 24 h of that." >> "$GITHUB_STEP_SUMMARY"
              utc() { date -u -d "@$1" '+%Y-%m-%dT%H:%MZ'; }
              printf '%s\t%s\t%s\t%s\t%s\t%s\tpass\n' "$GITHUB_RUN_NUMBER" "$VERSION" "$(utc "$(cat published-at)")" "$(utc "$start")" "$(utc "$seen")" "$minutes" > canary-result.tsv
              exit 0
            fi
            if [ $(( $(date +%s) - start )) -gt 7200 ]; then
              echo "Canary codeyard.canary $VERSION: not revoked in the index after 2 hours." >> "$GITHUB_STEP_SUMMARY"
              printf '%s\t%s\t\t%s\t\t>120\tfail\n' "$GITHUB_RUN_NUMBER" "$VERSION" "$(date -u -d "@$start" '+%Y-%m-%dT%H:%MZ')" > canary-result.tsv
              exit 1
            fi
            sleep 60
          done
      # Kept for the release notes (exit criterion 4: three runs in a row within 24 h): one line per run on the
      # yard-canary-log branch, never on main. `git show origin/yard-canary-log:canary.tsv | tail -n 3`
      - name: Record the result
        if: always() && hashFiles('canary-result.tsv') != ''
        run: |
          git config user.name "yard-canary"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp canary-result.tsv "$RUNNER_TEMP/line"
          if git fetch --depth=1 origin yard-canary-log; then
            git checkout -q -B yard-canary-log FETCH_HEAD
          else
            git checkout -q --orphan yard-canary-log
            git rm -rq --cached .
            printf 'run\tversion\tpublished\trevoked\tseen in index\tminutes\tresult\n' > canary.tsv
          fi
          cat "$RUNNER_TEMP/line" >> canary.tsv
          git add canary.tsv
          git commit -qm "Canary run $GITHUB_RUN_NUMBER"
          git push -q origin HEAD:yard-canary-log
