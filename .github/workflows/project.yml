# Moves issues across the Codeyard project board (Status, Start date, epics, unblocking).
# The rules are in scripts/project-sync.py; CONTRIBUTING.md ("Issues and labels") describes them.
# Needs the PROJECT_TOKEN secret: a classic token with the `project` and `public_repo` scopes.
name: project
on:
  issues:
    types: [opened, reopened, closed, assigned, unassigned]
  # `_target` runs this file from the default branch with the secret, also for pull requests from forks; it never
  # checks out or runs the pull request's code.
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [ci]
    types: [completed]
  # Relationship changes made in the sidebar send no event; this catches them, and anything a failed run missed.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/project-sync.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: python3 -I scripts/project-sync.py ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'reconcile' || 'event' }}
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
