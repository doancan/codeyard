# Build the registry's image (yard, Litestream, rclone, the operating scripts and the site) and publish it to the GitHub
# Container Registry as ghcr.io/<owner>/codeyard-yard: `latest` and `sha-<commit>`. The server runs it with
# `docker compose pull && docker compose up -d` (deploy/yard/docker, docs/registry.md "Running on Docker").
# Runs on every push to main that changes yard, the crates it is built from, or the stack; and by hand.
name: yard-image
on:
  push:
    branches: [main]
    paths:
      - crates/yard/**
      - crates/ext-api/**
      - crates/ext-core/**
      - crates/ext-manifest/**
      - crates/ext-pkg/**
      - Cargo.lock
      - deploy/yard/docker/**
      - .github/workflows/yard-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: yard-image

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node.js 24
        with:
          shared-key: yard-deploy
      - run: cargo test --locked -p yard
      - run: cargo build --release --locked -p yard
      - name: Build the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeyard-yard"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          install -m 755 target/release/yard deploy/yard/docker/yard
          docker build deploy/yard/docker \
            --build-arg YARD=included \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=Codeyard extension registry (yard) and site" \
            -t "$image:latest" -t "$image:sha-${GITHUB_SHA::12}"
      - name: Check the image
        run: |
          docker run --rm "$IMAGE:latest" yard --version
          docker run --rm "$IMAGE:latest" litestream version
          docker run --rm "$IMAGE:latest" test -s /opt/yard/site/index.html
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          echo "Published $IMAGE:latest and $IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
