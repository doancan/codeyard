name: fuzz
# Hostile-input tests of the extension crates for longer than `cargo test` runs them: 10 minutes on every pull request
# that touches them, 4 hours every night with a new seed. A failure prints the seed and round; rerun locally with
#   CODEYARD_FUZZ_SEED=<seed> CODEYARD_FUZZ_SECS=600 cargo test --release -p <crate> fuzz
on:
  pull_request:
    paths: ["crates/ext-*/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per fuzz test
        default: "10"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2, Node.js 24
        with:
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fuzz
        env:
          MINUTES: ${{ github.event_name == 'schedule' && '240' || inputs.minutes || '10' }}
          CODEYARD_FUZZ_SEED: ${{ github.run_id }}
        run: |
          export CODEYARD_FUZZ_SECS=$((MINUTES * 60))
          echo "fuzz: ${MINUTES} min per test, seed ${CODEYARD_FUZZ_SEED}"
          # Package names, not folder names: crates/ext-sdk is the codeyard-extension package.
          crates=$(for d in crates/ext-*/; do sed -n 's/^name = "\(.*\)"$/-p \1/p' "$d/Cargo.toml" | head -n 1; done)
          # The tests of each crate run in parallel, so the wall time is about MINUTES per crate.
          cargo test --locked --release $crates fuzz
