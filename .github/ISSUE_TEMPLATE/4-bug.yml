name: Bug report
description: Something does not work as documented
title: "[Bug] "
labels: ["type: bug"]
projects: ["doancan/2"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** do not file them here, use the private advisory link on the issue chooser (see SECURITY.md).
        **Title:** `[Bug] ` followed by what goes wrong ("Crash when …", "… is not saved"), at most **72 characters** in total.
        **Labels:** exactly two: `type:` (set by this form) and one `area:` (set at triage). Priority, effort and dates are fields on the project board.
  - type: input
    id: version
    attributes:
      label: Codeyard version
      description: "`codeyard --version` or the About dialog"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Where does it happen?
      options:
        - Local folder
        - Remote folder (SSH)
        - Both
        - Not related to a folder
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is it for you?
      options:
        - Data loss or crash
        - A feature does not work, no workaround
        - A feature does not work, there is a workaround
        - Cosmetic or wording
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a fresh start. A minimal file, folder or settings snippet helps most.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Exact messages, screenshots.
    validations:
      required: true
  - type: input
    id: regression
    attributes:
      label: Last version where it worked
      description: Leave empty if unknown or if it never worked.
  - type: textarea
    id: logs
    attributes:
      label: Logs and reports
      description: The Output panel, a crash report from `crashes/` (see docs/troubleshooting.md), `CODEYARD_DAP_TRACE=1` output. Remove anything private.
      render: text
  - type: markdown
    attributes:
      value: |
        ---
        The fields below are for maintainers. Reporters can leave them empty.
  - type: textarea
    id: root-cause
    attributes:
      label: Root cause
      description: "(Maintainers) What is wrong in the code, with `path:line`."
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] A failing test reproduces the bug before the fix
        - [ ] The test passes with the fix; related failure paths are tested too
        - [ ] `scripts/check.sh` passes
        - [ ] CHANGELOG has a line under *Unreleased*
