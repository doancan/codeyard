name: Feature
description: A user-visible capability, specified well enough to build and verify
title: "[Feature] "
labels: ["type: feature"]
projects: ["doancan/2"]
body:
  - type: markdown
    attributes:
      value: |
        **Title:** `[Feature] ` followed by an imperative summary ("Show …", "Pass …"), at most **72 characters** in total.
        **Labels:** exactly two: `type:` (set by this form) and one `area:` (set at triage). Priority, effort and dates are fields on the project board.
        **Relationships:** set the parent epic, sub-issues and *blocked by* in the sidebar, not in the text.
        Not sure yet what you want? Start a Discussion instead; a feature issue is a specification.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What the feature does, in two or three sentences a user would understand.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and motivation
      description: What goes wrong or is impossible today. Code references (`path:line`) and concrete examples, not the solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Everything the feature reads or reacts to - settings and their shape, user actions, commands, files, protocol messages.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Outputs
      description: Everything observable - UI, messages (exact text), files written, protocol messages sent, state changes.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design
      description: The approach and the modules it touches. Keep it to what a reviewer needs to agree with before code is written.
    validations:
      required: true
  - type: textarea
    id: edge-cases
    attributes:
      label: Edge cases and failure modes
      description: A table of situation → expected behaviour. Hostile or malformed input, missing tools, remote folders, untrusted folders.
      value: |
        | Situation | Expected behaviour |
        | --- | --- |
        |  |  |
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered, each one checkable. Given / When / Then where it helps.
      value: |
        1. **Given** … **when** … **then** …
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test and verification
      description: The tests that prove each acceptance criterion, by layer (docs/testing.md). Name the file each one goes in.
      value: |
        **Unit**
        -

        **Fuzz / hostile input**
        -

        **End to end (fake server or adapter)**
        -

        **Real tool** (skipped with a message when the tool is missing)
        -

        **Manual check**
        -
    validations:
      required: true
  - type: checkboxes
    id: obligations
    attributes:
      label: Applicable obligations
      description: Tick the ones that apply; each ticked rule is checked in review.
      options:
        - label: Memory and size budgets (docs/architecture.md, scripts/memcheck.sh)
        - label: Workspace Trust (nothing runs or is sent for an untrusted folder)
        - label: Privacy (no network request the user did not start, no telemetry)
        - label: SSH parity (works the same on a remote folder)
        - label: Windows parity (builds and behaves on Windows, or the gap is documented)
        - label: Interface text translated (every Complete language)
        - label: Documentation and CHANGELOG updated
        - label: No new dependency, or the reason is stated
        - label: No third-party product names in interface text, docs or commits
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Every acceptance criterion has a passing test
        - [ ] `scripts/check.sh` passes (fmt, clippy, arch-check, docs-check, deny, audit, tests)
        - [ ] Failure paths are tested and their messages asserted (English and Turkish)
        - [ ] User guide, generated settings reference and CHANGELOG updated
        - [ ] Reviewed and merged into `main`
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and open questions
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      description: Copied to the Effort field on the project board at triage.
      options:
        - XS (up to two hours)
        - S (under a day)
        - M (one to three days)
        - L (up to a week; consider splitting)
        - XL (more than a week; split before work starts)
    validations:
      required: true
