[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.13.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doancan/codeyard"

# Full debug info made every test binary hundreds of MB (target/debug reached 24 GB).
# Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# No cross-crate LTO and 16 codegen units: a release build takes about 40% less time (a release is built twice, for macOS and
# Windows, on every pull request into develop) for a binary 4% larger. Measured on the same sources, 8 interleaved runs each:
# first frame 230 ms vs 236 ms (p95 241 ms both), keystroke frame 25.3 ms both (p95 32.3 vs 32.2 ms): within the performance gate's noise.
[profile.release]
lto = false
codegen-units = 16
strip = true

# Remote agent: this binary is copied to servers, so size matters.
[profile.release-agent]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Patched GPUI: see vendor/gpui/PATCHES.md
[patch.crates-io]
# Local patch for Linux builds (libc::ENOATTR does not exist there): see vendor/xattr/src/sys/mod.rs
xattr = { path = "vendor/xattr" }
gpui = { path = "vendor/gpui" }
